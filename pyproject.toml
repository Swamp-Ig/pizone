[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "python-izone"
description = "A python interface to the iZone airconditioner controller"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["licence.txt"]
authors = [{ name = "Penny Wood", email = "pypl@ninjateaparty.com" }]
requires-python = ">=3.14"
keywords = ["iZone", "IoT"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
]
dependencies = [
  "aiohttp>=3.14.3",
  "ifaddr>=0.2.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Swamp-Ig/pizone"

[project.optional-dependencies]
test = [
  "pytest>=6.2.2",
  "pytest-aio",
  "pytest-aiohttp",
  "pytest-cov",
]

[dependency-groups]
test = [
  "pytest>=6.2.2",
  "pytest-aio",
  "pytest-aiohttp",
  "pytest-cov",
]
dev = [
  { include-group = "test" },
  "ruff>=0.15.20",
  "mypy",
  "build",
]

[tool.coverage.run]
source = ["pizone"]
omit = ["pizone/version.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.14"
files = ["pizone"]
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# VS Code / Cursor passes open files explicitly; mypy then ignores `files`/`exclude`.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Ruff config broadly aligned with Home Assistant core (select/ignore + format).
# HA-only plugins/import aliases are omitted; known-first-party is pizone.
[tool.ruff]
required-version = ">=0.15.20"
target-version = "py314"
src = ["pizone", "tests"]

