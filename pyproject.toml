[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"__future__.annotations".msg = "Not needed; pizone requires Python 3.14+"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["pizone"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "SLF001", # tests exercise private APIs
  "INP001", # test modules are not packages
  "T201",   # allow prints in hardware/fullstack helpers
  "D",      # do not enforce docstring style in tests
]
"scripts/**" = ["T20", "INP001"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pizone/version.py"

[tool.hatch.build.targets.wheel]
packages = ["pizone"]

[tool.hatch.version.raw-options]
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "v*",
  "--first-parent",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not hardware'"
markers = [
  "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
  "hardware: requires a reachable iZone controller on the local network",
]
