[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "python-izone"
description = "A python interface to the iZone airconditioner controller"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["licence.txt"]
authors = [{ name = "Penny Wood", email = "pypl@ninjateaparty.com" }]
requires-python = ">=3.14"
keywords = ["iZone", "IoT"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
]
dependencies = [
  "aiohttp>=3.14.1",
  "ifaddr>=0.2.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Swamp-Ig/pizone"

[project.optional-dependencies]
test = [
  "pytest>=6.2.2",
  "pytest-aio",
  "pytest-aiohttp",
  "pytest-cov",
]

[dependency-groups]
test = [
  "pytest>=6.2.2",
  "pytest-aio",
  "pytest-aiohttp",
  "pytest-cov",
]
dev = [
  { include-group = "test" },
  "pylint",
  "mypy",
  "build",
]

[tool.coverage.run]
source = ["pizone"]
omit = ["pizone/version.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pizone/version.py"

[tool.hatch.build.targets.wheel]
packages = ["pizone"]

[tool.hatch.version.raw-options]
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "v*",
  "--first-parent",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not hardware'"
markers = [
  "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
  "hardware: requires a reachable iZone controller on the local network",
]
